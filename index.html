<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte à Rebours - 6 Août</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --background-color: #f5f7fa;
            --card-background: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-background);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--primary-color);
        }

        .date-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e1e8ed;
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .date-display {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .countdown-display {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .countdown-box {
            background-color: #f0f4f8;
            border-radius: 12px;
            padding: 15px;
            width: 40%;
            transition: transform 0.2s;
        }

        .countdown-box:hover {
            transform: translateY(-2px);
        }

        .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            display: block;
        }

        .unit {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .celebration {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2ecc71;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Objectif : 6 Août</h1>
        
        <div class="date-section">
            <div class="label">Date d'aujourd'hui</div>
            <div id="current-date" class="date-display">-</div>
        </div>

        <div class="date-section">
            <div class="label">Prochain 6 Août</div>
            <div id="target-date" class="date-display">-</div>
        </div>

        <div class="label">Temps restant</div>
        <div id="countdown-container" class="countdown-display">
            <div class="countdown-box">
                <span id="months-left" class="number">-</span>
                <span id="months-unit" class="unit">Mois</span>
            </div>
            <div class="countdown-box">
                <span id="days-left" class="number">-</span>
                <span id="days-unit" class="unit">Jours</span>
            </div>
        </div>
    </div>

    <script>
        function updateCountdown() {
            const now = new Date();
            
            // Options pour formater les dates en français
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('fr-FR', options);

            // Détermination de l'année cible (cette année ou l'année prochaine)
            let targetYear = now.getFullYear();
            let targetDate = new Date(targetYear, 7, 6); // Attention: en JS les mois commencent à 0 (7 = Août)

            // Si le 6 août de cette année est déjà passé, on cible l'année suivante
            if (now > targetDate) {
                targetYear++;
                targetDate = new Date(targetYear, 7, 6);
            }

            document.getElementById('target-date').textContent = targetDate.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

            // Vérification si c'est aujourd'hui le jour J
            if (now.getDate() === 6 && now.getMonth() === 7) {
                document.getElementById('countdown-container').innerHTML = `<div class="celebration">🎉 C'est aujourd'hui ! 🎉</div>`;
                return;
            }

            // Calcul de la différence en mois et jours de manière relative
            let currentYear = now.getFullYear();
            let currentMonth = now.getMonth();
            let currentDay = now.getDate();

            let targetMonth = targetDate.getMonth();
            let targetDay = targetDate.getDate();

            let monthsDiff = targetMonth - currentMonth + (12 * (targetYear - currentYear));
            let daysDiff = targetDay - currentDay;

            // Ajustement si les jours sont négatifs
            if (daysDiff < 0) {
                monthsDiff--;
                // Trouver le dernier jour du mois précédent pour reporter les jours correctement
                const previousMonth = new Date(targetYear, targetMonth, 0);
                daysDiff += previousMonth.getDate();
            }

            // Mise à jour de l'affichage textuel et gestion du singulier/pluriel
            document.getElementById('months-left').textContent = monthsDiff;
            document.getElementById('months-unit').textContent = monthsDiff <= 1 ? 'Mois' : 'Mois'; // "Mois" est invariable

            document.getElementById('days-left').textContent = daysDiff;
            document.getElementById('days-unit').textContent = daysDiff <= 1 ? 'Jour' : 'Jours';
        }

        // Exécution immédiate au chargement
        updateCountdown();
        
        // Mise à jour automatique toutes les heures pour garder la date fraîche
        setInterval(updateCountdown, 3600000);
    </script>
</body>
</html>
